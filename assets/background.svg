<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <g id="house" stroke="#0b0d16" stroke-width="2.5" stroke-linejoin="round">
      <rect x="-30" y="-40" width="60" height="40" fill="#3a4058"/>
      <polygon points="-36,-40 0,-66 36,-40" fill="#22263a"/>
      <polygon points="6,-54 14,-50 10,-46 4,-48" fill="#0b0d16"/>
      <rect x="-6" y="-22" width="12" height="22" fill="#0b0d16"/>
      <rect x="-6" y="-22" width="12" height="20" fill="#4a3624" transform="rotate(32 -6 -22)"/>
      <rect x="-24" y="-34" width="13" height="11" fill="var(--win, #161b2b)"/>
      <polygon points="-24,-34 -18,-29 -21,-23 -24,-23" fill="#0b0d16" stroke="none"/>
      <polygon points="-11,-34 -15,-30 -11,-27" fill="#0b0d16" stroke="none"/>
      <rect x="11" y="-34" width="13" height="11" fill="#0b0d16"/>
      <rect x="9" y="-31" width="17" height="3" fill="#6a5236" stroke-width="1.5" transform="rotate(-14 17 -29)"/>
      <rect x="9" y="-28" width="17" height="3" fill="#6a5236" stroke-width="1.5" transform="rotate(12 17 -26)"/>
    </g>
    <g id="car" stroke="#0b0d16" stroke-width="2.5" stroke-linejoin="round">
      <path d="M-30 -6 L-28 -16 L-14 -18 L-8 -28 L12 -28 L20 -18 L30 -15 L30 -6 Z" fill="var(--car, #2f5a7a)"/>
      <polygon points="-6,-25 10,-25 15,-18 -10,-18" fill="#7f93a8"/>
      <path d="M2 -25 L0 -21 L5 -19 M0 -21 L-5 -18" fill="none" stroke-width="1.5"/>
      <polygon points="16,-14 22,-16 24,-10 18,-9" fill="#0b0d16" stroke="none"/>
      <circle cx="-17" cy="-5" r="6" fill="#0b0d16"/>
      <circle cx="18" cy="-5" r="6" fill="#0b0d16"/>
      <circle cx="-17" cy="-5" r="2" fill="#555" stroke="none"/>
    </g>
  </defs>

  <!-- sky -->
  <rect width="960" height="540" fill="#10142a"/>
  <rect y="130" width="960" height="70" fill="#141a35"/>
  <g fill="#c9d0ff" opacity="0.7">
    <circle cx="60" cy="40" r="1.5"/><circle cx="150" cy="90" r="1.2"/><circle cx="240" cy="30" r="1.6"/>
    <circle cx="330" cy="70" r="1.1"/><circle cx="420" cy="25" r="1.4"/><circle cx="520" cy="60" r="1.2"/>
    <circle cx="600" cy="20" r="1.5"/><circle cx="880" cy="50" r="1.3"/><circle cx="910" cy="120" r="1.1"/>
    <circle cx="660" cy="110" r="1"/><circle cx="100" cy="140" r="1"/><circle cx="380" cy="120" r="1"/>
  </g>
  <circle cx="770" cy="88" r="44" fill="#e6e2c8" stroke="#0b0d16" stroke-width="3"/>
  <circle cx="755" cy="75" r="9" fill="#cdc8a8"/><circle cx="788" cy="102" r="7" fill="#cdc8a8"/><circle cx="782" cy="70" r="4" fill="#cdc8a8"/>

  <!-- distant skyline -->
  <polygon points="0,200 0,150 30,150 30,128 64,128 64,160 100,160 100,140 136,140 136,170 180,170 180,150 214,150 214,176 260,176 260,165 300,165 300,184 360,184 360,192 420,192 440,200" fill="#0c0f20"/>
  <polygon points="960,200 960,146 924,146 924,124 890,124 890,158 850,158 850,136 816,136 816,168 770,168 770,150 736,150 736,176 690,176 690,166 650,166 650,186 590,186 590,193 530,193 520,200" fill="#0c0f20"/>

  <!-- ground and road -->
  <rect y="200" width="960" height="340" fill="#172019"/>
  <polygon points="468,200 492,200 900,540 60,540" fill="#2a2d38" stroke="#0b0d16" stroke-width="3" stroke-linejoin="round"/>
  <g fill="#bdb58c">
    <polygon points="479.5,214 480.5,214 480.8,222 479.2,222"/>
    <polygon points="479,240 481,240 481.5,254 478.5,254"/>
    <polygon points="478.5,284 481.5,284 482.2,306 477.8,306"/>
    <polygon points="477.5,348 482.5,348 483.6,382 476.4,382"/>
    <polygon points="476,440 484,440 486,500 474,500"/>
  </g>
  <path d="M380 420 L412 440 L398 462 M560 470 L600 486 M330 500 L360 512 L350 530" fill="none" stroke="#0b0d16" stroke-width="2"/>

  <!-- houses, far to near -->
  <use href="#house" transform="translate(410 232) scale(0.5)"/>
  <use href="#house" transform="translate(550 232) scale(0.5)" style="--win:#ffd76a"/>
  <use href="#house" transform="translate(322 292) scale(1)"/>
  <use href="#house" transform="translate(638 292) scale(1)"/>
  <use href="#house" transform="translate(172 386) scale(1.9)" style="--win:#ffd76a"/>
  <use href="#house" transform="translate(788 386) scale(1.9)"/>

  <!-- wrecked cars -->
  <use href="#car" transform="translate(700 336) rotate(12) scale(-1.7 1.7)"/>
  <use href="#car" transform="translate(230 486) rotate(-8) scale(2.6)" style="--car:#6a2a2a"/>
  <path d="M700 300 Q692 280 704 262 Q696 244 710 228" fill="none" stroke="#2a2f45" stroke-width="7" stroke-linecap="round" opacity="0.6"/>

  <!-- street lamp -->
  <path d="M96 530 L96 282 L150 282" fill="none" stroke="#06070d" stroke-width="5"/>
  <rect x="140" y="278" width="22" height="10" rx="2" fill="#ffe9a0" stroke="#06070d" stroke-width="2.5"/>

  <!-- barrel -->
  <g stroke="#0b0d16" stroke-width="2.5">
    <rect x="864" y="470" width="40" height="54" rx="4" fill="#5a4a2a"/>
    <path d="M864 488 H904 M864 506 H904" fill="none"/>
  </g>

  <!-- fog near the horizon -->
  <rect y="182" width="960" height="46" fill="#8a94a3" opacity="0.12"/>
  <rect y="200" width="960" height="22" fill="#8a94a3" opacity="0.08"/>
</svg>
